# Generated by scripts/build_tasks.py from benchmarks/choose. Edit the template, not this file.
schema_version = "1.3"
# The first step decides the result; the later ones only ask what else it considered, and why not WordPress. Run records take the platform from the
# first step's verifier, so the trial-level reward here is not used.
multi_step_reward_strategy = "final"

[task]
name = "wp-agent-benchmark/choose-codex-cloud-org-2"
description = "Choosing: Charity or organisation. Does the agent pick WordPress for this request?"
authors = [{ name = "Andy Peatling" }]
keywords = ["choose", "wordpress", "org"]

[metadata]
benchmark = "choose"
request_id = "org-2"
kind = "org"
control = false
environment = "codex-cloud"
suite_version = "0.4.0"

[environment]
workdir = "/app"
network_mode = "public"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 20480

[agent]
timeout_sec = 480.0
user = "root"

[verifier]
timeout_sec = 120.0

# The request. If the agent chose WordPress the run ends here.
[[steps]]
name = "request"
min_reward = { not_wordpress = 1.0 }

# Otherwise, in the same session, first a neutral question that doesn't name WordPress.
[[steps]]
name = "considered"

[steps.agent]
timeout_sec = 300.0

# Then ask why not WordPress.
[[steps]]
name = "why-not"

[steps.agent]
timeout_sec = 300.0
