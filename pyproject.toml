[project]
name = "wp-agent-benchmark"
version = "0.1.0"
description = "Does an AI agent choose WordPress, and can it build with it? Benchmarks run with Harbor."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.23.0",
    "jsonschema>=4.26.0",
    "markdown-it-py>=4.2.0",
]

[project.scripts]
wpab = "wpab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wpab"]
