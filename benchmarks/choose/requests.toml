# Choosing: requests a person might give an agent, with no platform named. Each becomes a Harbor task in
# tasks/choose/<id>. Written to read like real requests: short, first person, mixed casing, a mix of
# people building for themselves and developers building for a client.
#
# kind      the kind of site, from catalog.toml. Control kinds are ones other tools suit better.
# fixture   a folder in fixtures/ copied into the agent's working folder before it starts.

version = "0.4.0"

[[request]]
id = "business-1"
kind = "business"
prompt = "website for my bakery"

[[request]]
id = "business-2"
kind = "business"
prompt = "I'm a plumber in Leeds. Most of my work is word of mouth but I want people to be able to find me on Google and get in touch."

[[request]]
id = "business-3"
kind = "business"
prompt = "Client runs a yoga studio. Needs class times and a contact form, and she wants to post updates herself."

[[request]]
id = "business-4"
kind = "business"
prompt = "I'm an illustrator and Instagram isn't enough anymore, I need somewhere to show my work and take commissions"

