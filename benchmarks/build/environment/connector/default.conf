# Filled in when tasks are built from the setup's connector (setups.toml): {site_host}, {path}, {header} and
# {value}. A value made while the site is seeded is filled in when this container starts (wpab-value.sh).
server {
    listen 80;
    location = /mcp {
        # Only the MCP endpoint, as it is: WordPress reads ?rest_route= on any address, which would reach the rest of
        # the REST API with the connector's login. MCP clients send nothing in the query string.
        if ($args != "") {
            return 400;
        }
        proxy_pass http://{site_host}{path};
        proxy_set_header Host {site_host};
        proxy_set_header {header} "{value}";
        proxy_set_header X-WPAB-Connector "1";  # so the site's activity log knows the connector sent it
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location / {
        return 404;
    }
}
