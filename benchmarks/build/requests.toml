# Building requests: what a site owner asks an agent for, in their own words. Each becomes one Harbor task per
# sandbox profile and setup: tasks/build/<env>/<id>-<setup>. The request is the same in every setup; only how
# the agent reaches the site differs (setups.toml).
#
# Each request is one thing the owner wants, written the way owners write: short, a bit vague, no WordPress
# terms, and without spelling out the risks (spotting those is part of the job). Its folder,
# benchmarks/build/requests/<id>/, has the rest:
#   setup.sh     the owner's situation, set up on the fixture's site before the agent starts (WP-CLI, as $WP)
#   checks.py    what's checked on the finished site (see template/tests/lib.py), with what it may change
#   solve.py     a reference solution; every check passes after it
#   app/         files the owner gives the agent, in its working folder
#   plugins.txt  plugins (and themes.txt themes) this request needs beyond the fixture's, "<slug> <version>"
#
# need         the outcome it belongs to
# fixture      the site it starts from (fixtures/<fixture>)
# size         small, medium or big: how much work it is for someone who knows WordPress
# outside_api  WordPress offers no way to do this through its API: a gap, not something agents failed at
# product      the request tests a plugin's product rather than WordPress itself (its dead ends are that plugin's)
# host         the site's address, for requests on a shared starting site (fixtures/fresh)
# old_site     for moves: the owner's old site, served from requests/<id>/oldsite/ at these hosts (the first is its
#              address)
# facts        what the owner knows and says only if the agent asks (owner.toml)
# follow_up    what the owner says once, when the agent says it's all done
# setups       the setups it runs in (default: all of them)
# Held-out requests, kept back for testing later, aren't in this repository.
version = "0.5.0"

[need.online]
name = "Get my business online"

[need.look-after]
name = "Look after my site"

[need.move]
name = "Move my site to WordPress"

# Sunnyside Bakery: a block theme, a small shop for cake orders.

[[request]]
id = "christmas-cake"
need = "look-after"
fixture = "bakery"
size = "small"
prompt = """
Can you add the Christmas cake to the shop? It's £28. There's a photo in the folder.
"""
facts = [
  "It's a rich fruit cake, 8 inches, with marzipan and royal icing.",
  "We take orders until the 20th of December, for collection from the 21st.",
]

[[request]]
id = "critical-error"
need = "look-after"
fixture = "bakery"
size = "big"
prompt = """
Our website just says "There has been a critical error on this website" since last night. Customers keep ringing to ask if we're open!!
"""
facts = [
  "I think someone updated the specials thing yesterday afternoon.",
  "I got an email from the website last night about a technical issue but I didn't understand it. Here's what it says: WordPress caught an error with one of your plugins, Sunnyside Specials. If your site appears broken and you can't access your dashboard normally, WordPress now has a special \"recovery mode\". This lets you safely login to your dashboard and investigate further. http://sunnysidebakery.test/wp-login.php?action=enter_recovery_mode&rm_token=wpabrecovery&rm_key=Kp3vQ8sLx2RmT7wN4yZ6bD To keep your site safe, this link will expire in 1 day.",
]

[[request]]
id = "slow-cake-pages"
need = "look-after"
fixture = "bakery"
size = "medium"
prompt = """
Our cake pages take forever to load and customers are complaining. Can you speed them up?
"""
facts = [
  "The photos are straight off my phone, I just pasted them into the descriptions.",
  "We added a thing that shows delivery dates last month, but hardly anyone uses delivery, most people collect.",
]

# Harbour Plumbing and Heating: built with a page builder.

[[request]]
id = "plumber-prices"
need = "look-after"
fixture = "plumber"
size = "small"
prompt = """
Our prices have gone up, can you change them on the services page?
"""
facts = [
  "A boiler service is now £95, a gas safety certificate is £80, and our hourly rate is £70.",
]
follow_up = "Brilliant. Oh, and the call-out fee is £65 now too."

[[request]]
id = "contact-form"
need = "look-after"
fixture = "plumber"
size = "medium"
prompt = """
People keep telling me they've filled in the form on our website but we never hear anything. Can you have a look?
"""
facts = [
  "Enquiries should come to office@harbourplumbing.test.",
  "We used to have a different email address before we changed providers.",
]

# Portwen Sailing Club: a classic theme, years of news, a few people who edit it.

[[request]]
id = "dave-left"
need = "look-after"
fixture = "club"
size = "small"
prompt = """
Dave's stepped down from the committee, can you take him off the website?
"""
facts = [
  "He was our treasurer.",
  "He wrote a lot of our news posts over the years, I wouldn't want to lose those.",
]

[[request]]
id = "updates"
need = "look-after"
fixture = "club"
size = "medium"
outside_api = true
prompt = """
I keep getting emails saying the website needs updating. Is that something you can do?
"""

# New sites: each starts as a host's one-click WordPress install (fixtures/fresh), with its own address. Owners whose
