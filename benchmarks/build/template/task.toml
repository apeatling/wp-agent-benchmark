schema_version = "1.3"

[task]
name = "wp-agent-benchmark/build-{env}-{id}-{setup}"
description = "Building: {need_name}. Does the agent get done what the site owner asked?"
authors = [{{ name = "Andy Peatling" }}]
keywords = ["build", "wordpress", "{need}"]

[metadata]
benchmark = "build"
request_id = "{id}"
need = "{need}"
fixture = "{fixture}"
size = "{size}"
outside_api = {outside_api}
product = "{product}"
setup = "{setup}"
setup_kind = "{setup_kind}"
environment = "{env}"
suite_version = "{suite_version}"

[environment]
workdir = "/app"
network_mode = "public"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 20480
{mcp_servers}
# Up to four turns: the request and the owner's replies (see benchmarks/build/owner.toml).
[agent]
timeout_sec = 6000.0
user = "{user}"

# The checks run after the agent, never in its sandbox: Harbor stops the sandbox (and anything the agent left running),
# the task's checker looks at the site over the network (environment/checker), and the verifier, in a container of
# its own, copies in what it found (tests/test.sh).
[verifier]
timeout_sec = 180.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[[verifier.collect]]
service = "checker"
command = "python3 /checks/checks.py"
timeout_sec = 180.0

[[artifacts]]
source = "/var/log/wpab/checks"
service = "checker"

# What the site saw during the run (mu-plugins/wpab-activity.php), collected from the site's container.
[[artifacts]]
source = "/var/log/wpab/activity.jsonl"
service = "wp"
