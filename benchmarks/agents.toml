# The agents tested: each maker's model in its own harness, as people use it. Shared by both benchmarks.
#
# id         model then harness, as a slug. Used everywhere: run records, the site and its URLs.
# harness    Harbor's agent for the tool, wrapped in wpab.agents so a stalled run gets one "go ahead" reply.
# model      provider/model as passed to the harness.
# version    the harness version, pinned for every run. "TODO" means not pinned yet: local runs only.
# head       one of the five most-used agents behind the headline.
# auth       how it can sign in: "api" (a key), "plan" (a personal subscription), or both.
# environment  the sandbox profile from environments.toml: the maker's own documented environment, or the
#            developer machine profile when there isn't one.
# resume     whether the harness can continue a session, needed for the nudge and the follow-up question.
# effort     reasoning effort, set to each tool's own default (medium for Claude Code, Codex and Gemini CLI) and
#            pinned so a harness update can't change it quietly. Left out, the harness's own
#            default is used and the run records it as null.

[[agent]]
id = "opus-5-5-claude-code"
name = "Opus 5.5"
harness_name = "Claude Code"
harness = "claude-code"
import_path = "wpab.agents:ClaudeCode"
model = "anthropic/claude-opus-5-5"
version = "2.1.288"
head = true
auth = ["api", "plan"]
environment = "claude-cloud"
resume = true
effort = "medium"

[[agent]]
id = "gpt-6-1-sol-codex"
name = "GPT-6.1-Sol"
harness_name = "Codex"
harness = "codex"
import_path = "wpab.agents:Codex"
model = "openai/gpt-6.1-sol"
version = "0.160.0"
head = true
auth = ["api", "plan"]
environment = "codex-cloud"
resume = true
effort = "medium"

