<!doctype html>
<html lang="en">
<head>
<!-- shared head: edit templates/head.html, then run scripts/sync_head.py -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css?v=213">
<link rel="stylesheet" href="/vt.css?v=7">
<link rel="stylesheet" href="/choose/choose.css?v=272">
<link rel="icon" href="/favicon-light.png?v=4" sizes="32x32" media="(prefers-color-scheme: light)"><link rel="icon" href="/favicon-dark.png?v=4" sizes="32x32" media="(prefers-color-scheme: dark)"><link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4"><link rel="manifest" href="/site.webmanifest">
<meta name="description" content="When someone asks an AI agent for a website and doesn't name a platform, does it choose WordPress? Real agents, real requests, every month.">
<meta property="og:type" content="website"><meta property="og:site_name" content="WordPress Agent Benchmarks"><meta property="og:image" content="https://wpab.view.fast/social-card.png?v=1"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="When WordPress isn't mentioned, do agents choose it? 0% of the sites agents built used WordPress.">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://wpab.view.fast/social-card.png?v=1">
<!-- /shared head -->
<title>Run · Building with WordPress · Agent Benchmarks</title>
<style>
  /* One run, set for reading like an idea page: the prompt as the title, the result, then what stopped it in a reading
     column, with the run's details in a rail beside it. The agent's own words and commands are never shown beyond the
     checked quotes (run transcripts aren't published). */
  :root { --no: #e58b8b; }
  .run { padding-top: var(--page-top); }
  .run .back { display: inline-block; }
  .run h1 { margin: var(--space-32) 0 0; max-width: 34ch; font-family: var(--serif); font-size: clamp(28px, 3.2vw, 40px); font-weight: 500; line-height: 1.2; text-wrap: pretty; color: var(--ink); }
  .run-result { display: flex; align-items: center; gap: 12px; margin: var(--space-24) 0 0; font-size: 20px; font-weight: 600; color: var(--ink); }
  .run-result.no { color: var(--no); }
  .rn-told { margin: 6px 0 0 36px; font-size: 16px; color: var(--ink-2); }
  .rn-fu { max-width: 60ch; margin: var(--space-16) 0 0; padding-left: 16px; border-left: 2px solid var(--rule-strong); font-family: var(--serif); font-size: 20px; line-height: 1.45; color: var(--ink-2); }
  .rn-fu b { display: block; margin-bottom: 2px; font-family: var(--sans); font-size: 14px; font-weight: 400; color: var(--muted); }
  .rn-body { display: grid; grid-template-columns: minmax(0, 680px) minmax(240px, 300px); justify-content: space-between; column-gap: var(--space-80); margin-top: var(--space-48); }
  .rn-main { min-width: 0; }
  .rn-main > section + section { margin-top: var(--space-64); }
  .rn-main h2 { margin: 0 0 var(--space-24); padding-top: var(--space-24); border-top: 1px solid; border-image: linear-gradient(to right, rgba(180, 188, 203, .28), transparent 80%) 1; font-family: var(--serif); font-size: 30px; font-weight: 500; line-height: 1.2; color: var(--ink); }
  .rn-main > section:first-child h2 { border: 0; padding-top: 0; }
  .rn-main p { margin: 0; font-size: 17px; line-height: 1.65; color: var(--ink-2); }
  /* What stopped it: each failed check, what happened, the agent's words, and the cause */
  .rn-stops { margin: 0; padding: 0; list-style: none; }
  .rn-stops > li + li { margin-top: var(--space-40); }
  .rn-stops h3 { margin: 0 0 8px; font-size: 17px; font-weight: 600; line-height: 1.4; color: var(--ink); }
  .rn-main .rn-why { font-family: var(--serif); font-size: 22px; line-height: 1.45; color: var(--ink); }
  .rn-main .rn-cause { margin-top: 12px; font-size: 15px; color: var(--muted); }
  .rn-stops .rn-cause a { color: var(--ink-2); }
  .rn-main .rn-says { margin: var(--space-16) 0 0; padding-left: var(--space-24); border-left: 2px solid var(--rule-strong); font-family: var(--serif); font-size: 20px; line-height: 1.45; color: var(--ink-2); }
  .rn-notes { margin: 0; padding: 0; list-style: none; }
  .rn-notes > li + li { margin-top: var(--space-32); }
  /* The checks, one per row */
  .rn-checks { margin: 0; padding: 0; list-style: none; }
  .rn-checks li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; column-gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); font-size: 16px; line-height: 1.4; color: var(--ink); }
  .rn-checks li:last-child { border-bottom: 1px solid var(--rule); }
  .rn-checks .st { font-size: 14px; color: var(--muted); text-align: right; }
  .rn-checks .fail .st { color: var(--no); }
  .rn-checks .skip { color: var(--muted); }
  .rn-main .rn-owner-said { margin-top: var(--space-16); padding-left: var(--space-24); border-left: 2px solid var(--rule-strong); }
  /* The rail */
  .rn-rail { align-self: start; padding: 4px var(--space-24); background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; }
  .rn-rail dl { margin: 0; }
  .rn-rail div { padding: var(--space-16) 0; }
  .rn-rail div + div { border-top: 1px solid var(--rule); }
  .rn-rail dt { margin: 0 0 4px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .rn-rail dd { margin: 0; font-size: 15px; line-height: 1.45; color: var(--ink); }
  .rn-rail dd a { color: var(--ink); text-decoration-color: var(--rule-strong); }
  .rn-rail .logo { vertical-align: -2px; margin-right: 8px; }
  .rn-rail .setup { display: flex; align-items: center; gap: 10px; }
  .rn-rail .glyph { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; background: var(--cat-code); color: var(--ink); }
  .rn-rail .glyph svg { width: 13px; height: 13px; }
  .rn-rail .id { font-variant-numeric: tabular-nums; }
  .run-missing .lede a { color: var(--ink-2); }
  @media (max-width: 1000px) {
    .rn-body { grid-template-columns: minmax(0, 1fr); row-gap: var(--space-64); }
    .rn-main, .rn-rail { max-width: 680px; }
  }
  @media (max-width: 640px) { .rn-main .rn-why { font-size: 19px; } .rn-main h2 { font-size: 26px; } .rn-checks .st { grid-column: 2; text-align: left; } }
</style>
</head>
<body data-page="run">
<main class="container run" id="run"></main>
<script src="chrome.js?v=21"></script>
<script src="../data/choose.js?v=16"></script>
<script src="../choose/data.js?v=70"></script>
<script src="../data/build.js?v=1"></script>
<script src="real.js?v=12"></script>
<script>
(function () {
  // One run: the prompt and the result, what stopped it, the checks, what the agent told the owner, with the run's
  // details beside it. The agent's own words and commands are never shown beyond checked quotes (no transcripts).
  const D = window.WPAB_DATA.build, C = window.CHOOSE, R = window.REAL, $run = document.getElementById('run');
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const ref = document.referrer ? new URL(document.referrer) : null;
  const back = ref && ref.origin === location.origin && ref.pathname.endsWith('/build/runs') ? ref.pathname + ref.search : 'runs';
  const backLink = `<a class="go back" href="${esc(back)}">Back to runs</a>`;
  const asked = new URLSearchParams(location.search).get('id') || '';
  const r = D.runs.find(x => x.id === asked);
  if (!r) {
    document.title = 'Run not found · Building with WordPress · Agent Benchmarks';
    $run.classList.add('run-missing');
    $run.innerHTML = `${backLink}<h1>We couldn’t find that run</h1>
      <p class="lede">${asked ? `There’s no run with the ID “${esc(asked)}”.` : 'No run was chosen.'}</p><p><a class="go" href="runs">See all runs</a></p>`;
    return;
  }
  const a = D.agents.find(x => x.id === r.agent), q = D.requests.find(x => x.id === r.request), need = D.needs.find(n => n.id === r.need);
  const CAUSE = { wordpress_lacks: 'WordPress has no way to do this with that access', connector_lacks: 'The MCP adapter has no way to do this',
    plugin_lacks: 'A plugin involved has no way to do this', didnt_ask: 'The agent didn’t ask the owner for what it needed',
    stopped_early: 'The agent could have done it, but stopped', did_it_wrong: 'The agent did something else', benchmark_fault: 'A fault in the benchmark, fixed since' };
  const UNPLUG = '<span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m19 5 3-3M2 22l3-3M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4ZM7.5 13.5 10 11M10.5 16.5 13 14M12 6l6 6 2.3-2.3a2.4 2.4 0 0 0 0-3.4l-2.6-2.6a2.4 2.4 0 0 0-3.4 0Z"/></svg></span>';
  const PLUG = '<span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg></span>';
  const deById = Object.fromEntries(D.dead_ends.map(d => [d.id, d]));
  document.title = `Run ${r.id} · Building with WordPress · Agent Benchmarks`;
  const names = Object.fromEntries(q.checks.map(c => [c.id, c.name]));
  const RD = k => `<span class="rd ${k}" aria-hidden="true"></span>`;

  const checks = Object.entries(r.checks).map(([k, c]) => {
    const state = c.passed ? 'on' : (c.required === false || c.status === 'not_reached' || c.status === 'not_judged') ? 'skip' : 'no';
    const st = c.passed ? (c.status === 'after_owner' ? 'Passed after the owner replied' : 'Passed') : c.status === 'not_reached' ? 'Not asked (no follow-up)'
      : c.status === 'not_judged' ? 'Not judged' : c.required === false ? 'Not required' : c.status === 'handed_back' ? 'Handed back' : 'Failed';
    return `<li class="${state === 'no' ? 'fail' : state}">${RD(state)}<span>${esc(names[k] || k)}</span><span class="st">${st}</span></li>`; }).join('');
  const routes = Object.keys(r.routes || {}).map(k => (D.routes.find(x => x.id === k) || { title: k }).title);
  // Only the failed checks the analysis explains; a run that finished by giving itself more access fails every check
  // for that one reason, said once instead.
  const stops = Object.entries(r.checks).filter(([, c]) => !c.passed && c.required !== false && !['not_reached', 'not_judged'].includes(c.status) && (c.what_stopped || c.detail || c.quote))
    .map(([k, c]) => `<li><h3>${esc(names[k] || k)}</h3>${c.what_stopped || c.detail ? `<p class="rn-why">${esc(c.what_stopped || c.detail)}</p>` : ''}
      ${c.quote ? `<p class="rn-says">“${esc(c.quote)}”</p>` : ''}
      ${c.cause ? `<p class="rn-cause">${esc(CAUSE[c.cause] || c.cause)}${(c.dead_ends || []).filter(d => deById[d]).map(d => `. Dead end: <a href="deadend?id=${d}">${esc(deById[d].title)}</a>`).join('')}</p>` : ''}</li>`).join('');
  const notes = list => `<ul class="rn-notes">${list.map(n => `<li><p>${esc(n.what)}</p><p class="rn-says">“${esc(n.quote)}”</p></li>`).join('')}</ul>`;
  const done = r.success_within;
  const result = done ? 'Completed' : r.success ? 'Completed, but only with access the agent gave itself' : 'Not completed';
  const told = r.success ? '' : r.told_owner ? 'It told the owner it couldn’t finish.' : 'It didn’t tell the owner it couldn’t finish.';
  const setup = r.kind === 'base' ? `<span class="setup">${UNPLUG}No MCP adapter installed</span>` : r.kind === 'official' ? `<span class="setup">${PLUG}MCP adapter installed</span>` : esc(R.ROUTE[r.kind]);
  const row = (dt, dd) => dd ? `<div><dt>${dt}</dt><dd>${dd}</dd></div>` : '';
  const sec = (h, body) => body ? `<section><h2>${h}</h2>${body}</section>` : '';

  $run.innerHTML = `${backLink}
    <h1>“${esc(q.prompt)}”</h1>
    ${q.follow_up ? `<p class="rn-fu"><b>Once it’s done</b>“${esc(q.follow_up)}”</p>` : ''}
    <p class="run-result ${done ? 'on' : 'no'}">${RD(done ? 'on' : 'no')}${result}</p>
    ${told ? `<p class="rn-told">${told}</p>` : ''}
    <div class="rn-body">
      <div class="rn-main">
        ${r.success && !done ? sec('Why it doesn’t count', `<p class="rn-why">The agent did the job, but only by going around the setup it was given${routes.length ? `: ${esc(routes.join(', ').replace(/^./, c => c.toLowerCase()))}` : ''}. A run counts as completed only if every check passes without the agent giving itself more access.</p>`) : ''}
        ${stops ? sec('What stopped it', `<ul class="rn-stops">${stops}</ul>`) : ''}
        ${sec('The checks', `<ol class="rn-checks" aria-label="Checks">${checks}</ol>`)}
        ${(r.owner_said || []).length ? sec('What the owner said', r.owner_said.map(t => `<p class="rn-says rn-owner-said">“${esc(t)}”</p>`).join('') + '<p class="rn-cause">The owner is scripted: it answers only from what it knows, with fixed lines.</p>') : ''}
        ${sec('What it told the owner wrongly', (r.told_wrong || []).length && notes(r.told_wrong))}
        ${sec('What it handled well', (r.handled_well || []).length && notes(r.handled_well))}
      </div>
      <aside class="rn-rail" aria-label="About this run"><dl>
        ${row('Agent', `${C.logo({ id: a.logo }, 15)}<a href="agent?id=${a.id}">${esc(a.name)}</a> in ${esc(a.harness)}`)}
        ${row('Setup', setup)}
        ${row('Need', esc(need.name))}
        ${row('Time', `${r.minutes ?? '?'} minutes`)}
        ${row('Ways it took', routes.length && esc(routes.join(', ')))}
        ${row('Run', `<span class="id">${esc(r.id)}</span>`)}
        ${row('The prompt', `<a href="request?id=${q.id}">Every run of this prompt</a>`)}
      </dl></aside>
    </div>`;
})();
</script>
</body>
</html>
