<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../site.css?v=210">
<link rel="stylesheet" href="../choose/choose.css?v=265">
<link rel="stylesheet" href="../vt.css">
<title>agent · Building with WordPress · Agent Benchmarks</title>
<style>
  .run-page .title { margin-top: var(--space-40); font-variant-numeric: tabular-nums; }
  .run-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-24); margin: var(--space-16) 0 0; font-size: var(--fs-ui); color: var(--ink-2); }
  .run-sub .logo { vertical-align: -2px; margin-right: 8px; }

  /* The five checks, left to right. A run stops at the first one it fails. */
  .ckrow { list-style: none; margin: var(--space-48) 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-12); }
  .ckrow li { padding-top: var(--space-12); border-top: 2px solid var(--ink-2); font-size: var(--fs-ui); line-height: 1.35; color: var(--ink); }
  .ckrow .mk { display: block; margin-bottom: 6px; font-size: 17px; line-height: 1; }
  .ckrow .st { display: block; margin-top: 4px; font-size: var(--fs-caption); color: var(--ink-2); }
  .ckrow .fail { border-top-color: var(--ink); font-weight: 600; }
  .ckrow .fail .st { color: var(--ink); font-weight: 500; }
  .ckrow .skip { border-top-color: var(--rule); color: var(--muted); }
  .ckrow .skip .st { color: var(--muted); }
  .ck-how { margin: var(--space-16) 0 0; max-width: 62ch; font-size: var(--fs-small); color: var(--ink-2); }
  .ck-how b { font-weight: 500; color: var(--ink); }

  .run-facts .wp { color: var(--wp); font-weight: 600; }

  /* Issues inside the facts list */
  .iss + .iss { margin-top: var(--space-24); padding-top: var(--space-24); border-top: 1px solid var(--rule); }
  .iss-h { margin: 0; font-weight: 500; }
  .iss-h .iid { margin-right: 10px; font-size: var(--fs-small); font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .iss-h .main { margin-left: 10px; font-size: var(--fs-caption); font-weight: 400; color: var(--muted); }
  .iss-note { margin: 4px 0 0; color: var(--ink-2); }
  .iss dl { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 4px var(--space-16); margin: var(--space-12) 0 0; font-size: var(--fs-small); }
  .iss dt { color: var(--muted); }
  .iss dd { margin: 0; font-size: var(--fs-small); color: var(--ink-2); }
  .iss-links { display: flex; flex-wrap: wrap; gap: 6px var(--space-24); margin: var(--space-12) 0 0; }

  .tx { margin: 0; padding: var(--space-16); background: var(--panel); font: 15px/1.65 var(--mono); color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
  .tx .cmd { color: var(--ink); }
  .tx .say { color: var(--ink); font-family: var(--sans); font-size: 15px; }

  .run-missing .lede a { color: var(--ink-2); }
  @media (max-width: 600px) {
    .ckrow { grid-template-columns: 1fr; gap: 0; }
    .ckrow li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: baseline; padding: 10px 0; border-top-width: 1px; }
    .ckrow .mk { margin: 0; }
    .ckrow .st { margin: 0 0 0 var(--space-12); }
    .iss dl { grid-template-columns: 1fr; gap: 0; }
    .iss dd { margin-bottom: 6px; }
  }
</style>
</head>
<body data-page="agents">
<main class="container run-page" id="page"></main>
<script src="chrome.js?v=21"></script>
<script src="../data/choose.js?v=15"></script>
<script src="../choose/data.js?v=67"></script>
<script src="../data/build.js?v=1"></script>
<script src="real.js?v=11"></script>
<script src="agent.js?v=6"></script>
<style>
  .p-list { margin: 0; padding-left: 1.1em; }
  .p-list li { margin-bottom: var(--space-12); }
  .p-list small { display: block; color: var(--muted); }
  .p-table td, .p-table th { padding: 8px 12px 8px 0; text-align: left; vertical-align: top; }
  .p-table td.num, .p-table th.num { text-align: right; }
  .run-facts q { color: var(--ink-2); }
</style>
</body>
</html>
