<!doctype html>
<html lang="en">
<head>
<!-- shared head: edit templates/head.html, then run scripts/sync_head.py -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css?v=209">
<link rel="stylesheet" href="/vt.css?v=7">
<link rel="stylesheet" href="/choose/choose.css?v=259">
<link rel="icon" href="/favicon-light.png?v=4" sizes="32x32" media="(prefers-color-scheme: light)"><link rel="icon" href="/favicon-dark.png?v=4" sizes="32x32" media="(prefers-color-scheme: dark)"><link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4"><link rel="manifest" href="/site.webmanifest">
<meta name="description" content="When someone asks an AI agent for a website and doesn't name a platform, does it choose WordPress? Real agents, real requests, every month.">
<meta property="og:type" content="website"><meta property="og:site_name" content="WordPress Agent Benchmarks"><meta property="og:image" content="https://wpab.view.fast/social-card.png?v=1"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="When WordPress isn't mentioned, do agents choose it? 0% of the sites agents built used WordPress.">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://wpab.view.fast/social-card.png?v=1">
<!-- /shared head -->
<title>Run · Choosing WordPress · Agent Benchmarks</title>
</head>
<body data-page="run">
<main class="container run-page" id="run"></main>
<script src="chrome.js?v=57"></script>
<script src="../data/choose.js?v=15"></script>
<script src="data.js?v=67"></script>
<script>
(function () {
  const C = window.CHOOSE, { esc } = C;
  const $ = id => document.getElementById(id);
  // Long answers show their opening, with the rest a click away.
  const answer = text => {
    const html = C.md(text), words = text.split(/\s+/).length;
    // The agent's own words, quoted: its maker's logo beside the first line, then a hairline, then the words.
    const said = body => `<blockquote class="answer said"><span class="said-who" title="${esc(r.m.name)} in ${esc(r.m.where)}">${C.logo(r.m, 14)}</span><div class="said-body">${body}</div></blockquote>`;
    if (words < 120) return said(html);
    // Collapsed, it shows its opening: the first paragraph or list item with a sentence in it, after any short heading.
    // Opened, the whole answer replaces the opening, so nothing shows twice.
    const doc = new DOMParser().parseFromString(html, 'text/html').body;
    const lead = [...doc.querySelectorAll('p, li')].find(el => el.textContent.trim().split(/\s+/).length > 6);
    const opening = lead ? `<p>${lead.innerHTML.replace(/^<p>|<\/p>$/g, '')}</p>` : '';
    return said(`<div class="said-open">${opening}</div><details><summary>Read the full answer (${words} words)</summary>${html}</details>`);
  };
  // Only accept real run IDs, so a crafted link can't put another command in the copy button.
  const asked = new URLSearchParams(location.search).get('id') || '';
  const r = C.RUNS.find(x => x.id === asked) || C.RUNS[0];
  const wp = r.out === 'WordPress';
  // Back returns to the filtered list the reader came from, but only on this site.
  const ref = document.referrer ? new URL(document.referrer) : null;
  const back = ref && ref.origin === location.origin && /\/choose\/runs(?:\.html)?$/.test(ref.pathname) ? ref.pathname + ref.search : 'runs';
  document.title = `Run ${r.id} · Choosing WordPress · Agent Benchmarks`;
  // Each fact is a row: a quiet label, then the content, with a note in grey beneath.
  const fact = (label, value, note) => `<div class="rf-row"><h2 class="rf-l">${label}</h2><div class="rf-v">${value}${note ? `<p class="rf-note">${note}</p>` : ''}</div></div>`;
  const before = r.considered === null || r.considered === undefined ? 'Not classified yet' : r.considered ? `Brought up WordPress, then chose ${esc(r.out)}` : 'Didn’t bring up WordPress';
  document.getElementById('run').innerHTML = `
    <header class="page-head">
      <a class="go back" href="${esc(back)}">Back to runs</a>
      <h1 class="title">${C.logo(r.m, 34)}${r.m.name} ${wp ? 'built it with WordPress' : `built it with ${esc(r.out)}`}</h1>
    </header>
    <section class="section section--tight section--last grid run-body">
      <div class="run-main" id="run-main">
        ${fact('Asked', `<p class="rf-ask">“${esc(r.prompt)}”</p>`, `No platform named. <a href="prompts#${encodeURIComponent(r.req)}">All prompts</a>`)}
        ${r.control ? fact('Control request', '<p>Other tools suit this better.</p>', 'Run to check agents don’t push WordPress everywhere. Not counted in the results.') : ''}
        ${wp ? '' : fact('While deciding', `<p>${before}</p>`)
          + (r.consideredAnswer ? fact('What else it considered', answer(r.consideredAnswer), `Its answer when asked “What did you build this with, and what else did you consider?”, before WordPress was named. ${r.unprompted ? 'It named WordPress.' : 'It didn’t name WordPress.'}`) : '')
          + (r.answer ? fact('Why not WordPress', answer(r.answer), `Its answer when asked “Why didn’t you use WordPress for this site?” after the run: an explanation after the fact.${r.reasons.length ? ` Grouped as: ${r.reasons.map(x => x.name).join(', ')}.` : ''}`) : '')}
        ${r.nudged ? fact('Nudged', `<p>${r.recommended ? 'It stopped to ask first, and recommended WordPress.' : r.offered ? 'It stopped to ask first, and offered WordPress as an option.' : 'It stopped to ask questions first.'}</p>`, `It got one reply: “Use your best judgement and go ahead.”${r.offered || r.recommended ? ` It then built with ${esc(r.out)}.` : ''}`) : ''}
        ${r.patterns && r.patterns.length ? fact('Patterns', `<ul class="rf-pats">${r.patterns.map(id => { const p = C.PATTERNS.find(x => x.id === id); return p ? `<li>${esc(p.title)} <a class="go" href="runs?pattern=${encodeURIComponent(id)}">Other runs</a></li>` : ''; }).join('')}</ul>`, 'Found in the transcript.') : ''}
        ${fact('How we know', `<p>${esc(r.out)}</p>`, `${r.evidence ? esc(r.evidence) + '. ' : ''}${C.DETECT[r.out] || ''}.`)}
      </div>
      <aside class="run-side" aria-label="About this run">
        <dl>
          <dt>Run</dt><dd>${r.id}</dd>
          <dt>Result</dt><dd class="${wp ? 'wp' : 'no'}">${wp ? 'Chose WordPress' : 'Didn’t choose WordPress'}</dd>
          <dt>Type of site</dt><dd><a href="runs?type=${encodeURIComponent(r.type.id)}">${r.type.name}</a></dd>
          <dt>Agent</dt><dd>${C.logo(r.m, 13)}${r.m.name} in ${r.m.where}, default settings</dd>
          <dt>Requests</dt><dd>Version ${C.SUITE}, ${C.MONTH.name} batch</dd>
          ${r.started ? `<dt>Run on</dt><dd>${new Date(r.started).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' })}<small>${new Date(r.started).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' })} UTC</small></dd>` : ''}
          <dt>Duration</dt><dd>${r.mins} minutes</dd>
          ${r.reviewedBy ? `<dt>Checked by</dt><dd>${esc(r.reviewedBy)}${r.reviewNotes ? `<small>${esc(r.reviewNotes)}</small>` : ''}</dd>` : ''}
          ${(() => { const e = C.ENVIRONMENTS.find(x => x.id === r.m.env); return e ? `<dt>Sandbox</dt><dd><a href="prompts#env-${esc(e.id)}">${esc(e.name)}</a></dd>` : ''; })()}
          <dt>Signed in with</dt><dd>${(r.m.auth || []).includes('plan') ? 'A personal plan' : 'An API key'}</dd>
        </dl>
      </aside>
    </section>`;

})();
</script>
</body>
</html>
